name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: Structure, manifestes et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin/package-lock.json
      - name: Dépendances
        run: npm run preparer
      - name: Manifestes du plugin et de la marketplace (validate --strict)
        run: |
          npm install -g @anthropic-ai/claude-code
          npm run valider
      - name: Tests
        run: npm test
      - name: Références et exemples fictifs (schémas et cohérence)
        run: |
          node plugin/scripts/coach-rugby.mjs valider plugin/references
          node plugin/scripts/coach-rugby.mjs valider plugin/exemples

  donnees-personnelles:
    name: Données personnelles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aucune donnée personnelle de joueur dans le dépôt
        # Sans dépendance : le script n'importe que des modules node:*.
        run: node plugin/scripts/garde-rgpd.mjs --depot .

  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
