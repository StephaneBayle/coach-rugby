name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    name: Structure, manifestes et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugin/package-lock.json
      - name: Dépendances
        run: npm run preparer
      - name: Manifestes du plugin et de la marketplace (validate --strict)
        run: |
          npm install -g @anthropic-ai/claude-code
          npm run valider
      - name: Tests
        run: npm test
      - name: Références et exemples fictifs (schémas et cohérence)
        run: |
          node plugin/scripts/coach-rugby.mjs valider plugin/references
          node plugin/scripts/coach-rugby.mjs valider plugin/exemples
      - name: Bibliothèque d'exercices (fiches valides, index à jour, schémas SVG)
        run: |
          node plugin/scripts/coach-rugby.mjs valider plugin/bibliotheque
          node plugin/scripts/coach-rugby.mjs index-bibliotheque
          git diff --exit-code plugin/bibliotheque/INDEX.md || { echo "::error::INDEX.md n'est pas à jour : lancer node plugin/scripts/coach-rugby.mjs index-bibliotheque"; exit 1; }
          mkdir -p /tmp/schemas && for f in plugin/bibliotheque/exercices/*.yaml; do node plugin/scripts/coach-rugby.mjs terrain "$f" --sortie /tmp/schemas > /dev/null; done
      - name: Export des séances d'exemple (HTML A4 et téléphone, SVG, texte MCA, PDF via Chrome)
        run: |
          for s in plugin/exemples/*/*/seances/*/seance.yaml; do
            node plugin/scripts/coach-rugby.mjs exporter "$s" --pdf
            test -f "$(dirname "$s")/exports/fiche-a4.pdf" || { echo "::error::PDF non produit pour $s"; exit 1; }
          done
          for s in plugin/exemples/*/*/semaines/*/semaine.yaml; do
            node plugin/scripts/coach-rugby.mjs exporter "$s" --pdf
            test -f "$(dirname "$s")/exports/fiche-semaine-a4.pdf" || { echo "::error::PDF non produit pour $s"; exit 1; }
          done
          for s in plugin/exemples/*/*/matchs/*/match.yaml; do
            node plugin/scripts/coach-rugby.mjs exporter "$s" --pdf
            test -f "$(dirname "$s")/exports/fiche-match-a4.pdf" || { echo "::error::PDF non produit pour $s"; exit 1; }
          done
      - name: Feuilles de présence et tableaux d'exemple (xlsx et csv, en codes)
        run: |
          for e in plugin/exemples/*/*/effectif.yaml; do node plugin/scripts/coach-rugby.mjs exporter "$e"; done
          export COACH_RUGBY_DOSSIER=plugin/exemples/fictif-m10-les-ecureuils
          node plugin/scripts/coach-rugby.mjs tableau presences m10
          node plugin/scripts/coach-rugby.mjs tableau temps-de-jeu m10
          node plugin/scripts/coach-rugby.mjs tableau progres m10
          test -f plugin/exemples/fictif-m10-les-ecureuils/m10/exports/presences.xlsx
          COACH_RUGBY_DOSSIER=plugin/exemples/fictif-seniors-f3-les-goelands node plugin/scripts/coach-rugby.mjs tableau charge seniors-f3
          COACH_RUGBY_DOSSIER=plugin/exemples/fictif-seniors-f3-les-goelands node plugin/scripts/coach-rugby.mjs charge seniors-f3 --bilan --date 2026-10-09
      - name: Fiches d'exemple en artefact
        uses: actions/upload-artifact@v4
        with:
          name: fiches-exemples
          path: |
            plugin/exemples/*/*/seances/*/exports/
            plugin/exemples/*/*/semaines/*/exports/
            plugin/exemples/*/*/matchs/*/exports/
            plugin/exemples/*/*/exports/
          retention-days: 14
      - name: Schémas de terrain en artefact
        uses: actions/upload-artifact@v4
        with:
          name: schemas-terrain
          path: /tmp/schemas/
          retention-days: 14

  donnees-personnelles:
    name: Données personnelles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aucune donnée personnelle de joueur dans le dépôt
        # Sans dépendance : le script n'importe que des modules node:*.
        run: node plugin/scripts/garde-rgpd.mjs --depot .

  lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
