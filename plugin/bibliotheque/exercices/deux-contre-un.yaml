but: Créer et exploiter le surnombre - fixer le défenseur, puis passer au bon moment.
organisation: Couloir de 10 mètres de large. Deux attaquants face à un défenseur. Le défenseur arrête le porteur en le touchant à deux mains.
consignes:
  - Porteur, cours vers le défenseur pour l'obliger à venir sur toi.
  - Passe à ton partenaire quand le défenseur s'engage sur toi.
  - Défenseur, tu n'es pas obligé de choisir tout de suite.
  - On tourne les rôles à chaque passage.
variables:
  simplifier: [Défenseur qui marche, Couloir plus large]
  complexifier: [Défenseur qui part plus tôt, Couloir plus étroit]
criteres_reussite: [Le porteur fixe avant de passer, L'essai est marqué plus d'une fois sur deux]
securite: [Toucher à deux mains sans poussée, Arrêt du jeu au toucher]
