materiel: [6 plots, chasubles pour les éperviers]
but: Traverser le terrain en esquivant les défenseurs ; apprendre à accélérer et à prendre les intervalles.
organisation: Les enfants partent d'une ligne de fond. Un ou deux éperviers au milieu du terrain. Le but est d'atteindre la ligne d'en face.
consignes:
  - Au signal, traverse sans te faire toucher à deux mains par un épervier.
  - Touché ? Tu deviens épervier à ton tour.
  - Les éperviers touchent à deux mains, sans pousser ni retenir.
variables:
  simplifier: [Un seul épervier, Terrain plus large]
  complexifier: [Traverser avec un ballon en main, Éperviers qui se tiennent la main par deux]
criteres_reussite: [Les enfants accélèrent dans les espaces libres, Le toucher se fait sans brutalité]
securite: ["Toucher à deux mains sur le haut du corps, sans pousser", Espaces de dégagement autour du terrain]
