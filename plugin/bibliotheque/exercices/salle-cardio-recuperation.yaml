materiel: [Vélos ou rameurs]
but: Entretenir l'endurance sans chocs (trêve, joueur qui ne peut pas courir) ou récupérer le lendemain d'un match.
organisation: "Récupération : 20 à 30 minutes à allure facile (on peut parler). Entretien : 10 minutes faciles, puis 6 à 10 fois 1 minute soutenue / 1 minute facile, puis 5 minutes faciles."
consignes:
  - Allure facile = respiration aisée, on peut tenir une conversation.
  - Réglage du vélo ou du rameur avant de commencer.
