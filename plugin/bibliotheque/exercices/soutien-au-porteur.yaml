materiel: [plots, 1 ballon, chasubles]
but: Être toujours disponible pour le porteur - derrière lui et proche, prêt à recevoir.
organisation: Jeu au toucher à 4 contre 3. Après chaque toucher, le porteur doit passer à un partenaire qui arrive en soutien dans les 2 secondes, sinon le ballon change de camp.
consignes:
  - Partenaires, rapprochez-vous du porteur et placez-vous derrière lui.
  - Appelez le ballon - à gauche ou à droite.
  - Porteur, après le toucher, cherche le soutien le plus proche.
variables:
  simplifier: [Trois secondes pour passer, Un défenseur de moins]
  complexifier: [Défense à égalité numérique, Soutien obligatoire des deux côtés]
criteres_reussite: [Un soutien disponible à chaque toucher, Communication]
securite: [Toucher à deux mains sans poussée]
