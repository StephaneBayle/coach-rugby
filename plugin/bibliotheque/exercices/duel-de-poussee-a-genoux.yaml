id: duel-de-poussee-a-genoux
titre: Duel de poussée à genoux
licence: CC-BY-SA-4.0
auteurs: coach-rugby
theme: contact
categories: [m10, m12, m14, m15f, m16, m18f, m19, seniors]
niveau: decouverte
contact: contact-progressif
duree_min: 8
effectif: { min: 2, max: 24 }
espace: { longueur: 10, largeur: 10 }
materiel: [plots, tapis ou herbe souple]
but: Découvrir la posture de poussée (dos plat, tête haute) dans un duel ludique et contrôlé.
organisation: Binômes de même gabarit, à genoux face à face, mains sur les épaules du partenaire. Au signal, chacun essaie de faire reculer l'autre pendant 5 secondes.
consignes:
  - Dos plat, tête haute, regard devant - jamais la tête baissée.
  - Pousse avec les jambes et les épaules, pas avec la tête.
  - Au coup de sifflet, on s'arrête tout de suite.
variables:
  simplifier: [Poussée sur un bouclier tenu par l'éducateur, Durée de 3 secondes]
  complexifier: [Départ accroupi, Duel pour gagner un ballon posé entre les deux]
criteres_reussite: [Dos plat et tête haute, Arrêt immédiat au signal]
securite: [Binômes de gabarit comparable, Durée courte, Sol souple, Arrêt à la moindre douleur au cou]
