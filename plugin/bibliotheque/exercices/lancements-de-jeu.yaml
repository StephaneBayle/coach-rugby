id: lancements-de-jeu
titre: Lancements de jeu sans opposition
licence: CC-BY-SA-4.0
auteurs: coach-rugby
theme: manipulation-passes
categories: [m16, m18f, m19, seniors]
niveau: confirme
contact: aucun
exige: [touche, melee]
duree_min: 15
effectif: { min: 8, max: 30 }
espace: { longueur: 40, largeur: 30 }
materiel: [ballons, plots]
but: Répéter les lancements (touche, mêlée sans poussée, première main) à vitesse de match, sans fatigue ni contact.
organisation: Avants en touche et en mêlée sans poussée, trois-quarts sur les combinaisons de première main ; enchaînements courts, à vitesse de match.
consignes:
  - Annonces claires, précision avant vitesse.
  - Mêlée - liaisons et placement seulement, sans poussée.
  - Trois-quarts - alignement, timing de la passe, ligne de course.
variables:
  simplifier: [À vitesse réduite, Une seule combinaison]
  complexifier: [Annonce tardive, Une défense passive qui se place]
