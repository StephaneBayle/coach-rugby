  - { source: world-rugby-lois-du-jeu, note: "Lois de la touche et de la mêlée (à vérifier pour la saison)." }
schema:
  surface: { type: atelier, longueur: 40, largeur: 30, lignes: [{ x: 20, label: ligne de touche simulée }] }
