id: replacement-defensif-au-signal
titre: Replacement défensif au signal
licence: CC-BY-SA-4.0
auteurs: coach-rugby
theme: defense
categories: [m14, m15f, m16, m18f, m19, seniors]
niveau: intermediaire
contact: toucher
duree_min: 12
effectif: { min: 8, max: 20 }
espace: { longueur: 30, largeur: 20 }
materiel: [plots, ballons, chasubles]
but: Se replacer vite et bien après une action, pour être de nouveau aligné face à l'attaque.
organisation: Les défenseurs partent d'une zone décalée. Au signal de l'éducateur, l'attaque joue à un endroit annoncé et la défense doit se replacer en ligne avant de monter.
consignes:
  - Au signal, repérez où joue l'attaque.
  - Replacez-vous en courant, en regardant le ballon.
  - Alignez-vous, puis montez ensemble ; toucher à deux mains.
variables:
  simplifier: [Annonce plus tôt, Un attaquant de moins]
  complexifier: [Deux changements de point de jeu, Départ de la défense au sol]
criteres_reussite: [Ligne reformée avant la montée, Pas de trou entre les défenseurs]
securite: [Toucher sans poussée, Pas de croisement de course à pleine vitesse]
