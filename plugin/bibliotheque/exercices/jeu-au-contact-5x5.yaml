id: jeu-au-contact-5x5
titre: Jeu au contact à 5 contre 5
licence: CC-BY-SA-4.0
auteurs: coach-rugby
theme: jeu-reduit
categories: [m8, m10, m12, m14, m15f]
niveau: decouverte
contact: plaquage
exige: [plaquage]
duree_min: 15
effectif: { min: 8, max: 12 }
espace: { longueur: 30, largeur: 20 }
materiel: [8 plots, 1 ballon, chasubles]
but: Jouer dans la forme « jeu au contact » de l'école de rugby - avancer, plaquer bas, sans regroupement ni mêlée.
organisation: Deux équipes de 4 ou 5 sur un terrain réduit avec deux en-buts. Le porteur plaqué pose le ballon et un partenaire le joue tout de suite ; pas de ruck.
consignes:
  - Avance vers l'en-but ; la passe se fait vers l'arrière.
  - Plaqué ? Pose le ballon, un partenaire le ramasse et rejoue.
  - Pas de regroupement, pas de mêlée, pas de touche.
variables:
  simplifier: [Terrain plus large, Retour au toucher + 2 secondes pour les nouveaux]
  complexifier: [Terrain plus étroit, Nombre de passes imposé avant d'aller à l'essai]
criteres_reussite: [Plaquages bas, Le ballon est rejoué vite après un plaquage]
securite:
  - "Plaquage bas (taille ou en dessous), arbitrage strict."
  - "Choc à la tête : sortie immédiate et définitive, prévenir les parents, avis médical."
  - "Protège-dents fortement recommandé."
sources: [ffr-cahier-edr-2026-2027]
