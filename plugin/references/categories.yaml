        - { mois: [9, 10, 11, 12], formes: [toucher-2s] }
        - { mois: [1, 2, 3, 4, 5, 6], formes: [jeu-au-contact] }
      statut: a-verifier
      source: ffr-cahier-edr-2026-2027
      page: 7
    duree_seance_conseillee_min: { valeur: 60, statut: hypothese }
    temps_de_jeu: { valeur: "Chaque enfant joue au moins la moitié du temps ; écart minimal entre enfants", statut: hypothese, note: "Aucune règle de temps de jeu minimal trouvée dans le Cahier EDR 2026-2027 : repère d'équité pédagogique." }
