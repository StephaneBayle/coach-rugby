    temps_de_jeu: { valeur: "Tous les enfants jouent, rotations très fréquentes", statut: hypothese, note: "Aucune règle de temps de jeu minimal trouvée dans le Cahier EDR 2026-2027 : repère d'équité pédagogique." }
