regles_transverses:
  - id: matchs-secs-interdits-edr
    texte: À l'école de rugby, pas de match sec — seulement des plateaux ou tournois d'au moins 3 équipes, sans phase finale (quarts, demies, finale).
    concerne: [m6, m8, m10, m12, m14, m15f]
    statut: a-verifier
    source: ffr-cahier-edr-2026-2027
    page: 8
  - id: entrainement-inter-ages
    texte: À l'entraînement entre deux catégories voisines, la forme de jeu est celle de la catégorie la plus jeune, selon son calendrier.
    statut: a-verifier
    source: ffr-cahier-edr-2026-2027
    page: 14
  - id: nouveaux-arrivants
    texte: Pour les enfants arrivés en cours de saison, on peut reprendre les formes de pratique des mois précédents.
    statut: a-verifier
    source: ffr-cahier-edr-2026-2027
    page: 6
  - id: plan-de-seance-ffr-edr
    texte: "Plan de séance proposé par la FFR à l'école de rugby : situation ludique de manipulation de balle, situation jouée, situation de renforcement, situation jouée."
    concerne: [m8, m10, m12]
    statut: a-verifier
    source: ffr-cahier-edr-2026-2027
    page: 11
  - id: protege-dents
    texte: Protège-dents fortement recommandé en 2026-2027 (année d'information, sans sanction) ; obligatoire à partir de 2027-2028 pour toutes les pratiques avec contact ou plaquage (baby rugby, rugby à 5 et initiation sans plaquage exemptés).
    statut: a-verifier
    source: ffr-cahier-edr-2026-2027
    page: 16
  - id: commotion-sortie-definitive
    texte: Toute suspicion de commotion cérébrale, en match comme à l'entraînement, entraîne la sortie immédiate et définitive du terrain, sans retour au jeu ; les symptômes peuvent apparaître jusqu'à 48 heures après. Voir protocole-commotion.md.
    statut: a-verifier
    source: ffr-cahier-edr-2026-2027
    page: 17
  - id: arbitrage-jeunes-m12-m14
    texte: À l'école de rugby, les rencontres M12 et M14 sont arbitrées par de jeunes joueurs titulaires du passeport arbitrage, encadrés par l'éducateur.
    concerne: [m12, m14]
    statut: a-verifier
    source: ffr-cahier-edr-2026-2027
    page: 11
  - id: fdm-edr
    texte: "La feuille de match dématérialisée des écoles de rugby (FDM EDR) est l'outil officiel des plateaux et tournois depuis septembre 2026 (présences, commotions, discipline). La composition préparée avec coach-rugby n'est qu'un outil du coach."
    concerne: [m6, m8, m10, m12, m14, m15f]
    statut: a-verifier
    source: ffr-cahier-edr-2026-2027
    page: 10
  - id: passeport-joueur-de-devant
    texte: "M14 et M15F : le « Passeport du joueur de devant » est à préparer et à évaluer pour les joueurs des postes de devant (première ligne). Vérifier les conditions auprès du comité avant de composer une première ligne."
    concerne: [m14, m15f]
    statut: a-verifier
    source: ffr-cahier-edr-2026-2027
    page: 6
