# EXEMPLE FICTIF — Cycles de la saison — brouillon coach-rugby à adapter (hypothèses pédagogiques).
saison: 2026-2027
macrocycle:
  - phase: intersaison-bilan
    intention: Bilan de la saison et repos
    priorites:
      - Bilan avec les éducateurs
      - Préparer l'accueil de la rentrée
  - phase: reprise-prepa
    intention: Accueillir, faire jouer, poser les bases
    priorites:
      - Accueil des nouveaux
      - Jeux de course et de passe
      - Formes de jeu de début de saison
  - phase: plateaux-automne
    intention: Progresser par le jeu entre les plateaux
    priorites:
      - Avancer et soutenir
      - Découvrir la forme de jeu du moment
  - phase: treve
    intention: Repos
    priorites:
      - Repos
      - Bilan de mi-saison avec les éducateurs
  - phase: plateaux-printemps
    intention: Approfondir avec la nouvelle forme de jeu
    priorites:
      - S'approprier la nouvelle forme de jeu
      - Jouer en sécurité
  - phase: tournois-fin-saison
    intention: Plaisir, réussite et valorisation
    priorites:
      - Tournois
      - Fête de fin de saison
